<script>
  (function() {
    // Dynamic Timeframe Selector Toggle
    const buttons = document.querySelectorAll('.timeframe-btn');
    const salesEl = document.getElementById('metric-sales');
    const purchasesEl = document.getElementById('metric-purchases');

    const mockData = {
      year: {
        sales: '₹10,72,956.00',
        purchases: '₹12,800.00'
      },
      quarter: {
        sales: '₹3,48,210.00',
        purchases: '₹4,150.00'
      },
      month: {
        sales: '₹1,18,440.00',
        purchases: '₹1,200.00'
      }
    };

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => {
          b.className = 'timeframe-btn px-3 py-1 rounded-full font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface';
        });
        btn.className = 'timeframe-btn px-3 py-1 rounded-full font-label-md text-label-md transition-all duration-200 bg-surface-container-lowest text-primary font-semibold shadow-sm';

        const period = btn.getAttribute('data-period');
        if (mockData[period]) {
          salesEl.textContent = mockData[period].sales;
          purchasesEl.textContent = mockData[period].purchases;
        }
      });
    });
  })();
