name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Verify generated code is current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart' || \
            (echo '::error::Generated files are stale — run build_runner and commit.' && exit 1)

      - name: Analyze
        run: flutter analyze lib test

      - name: Test (goldens excluded)
        run: flutter test --exclude-tags golden --concurrency=1
