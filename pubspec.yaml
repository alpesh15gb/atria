name: atria
description: "Apex Books - Offline-first Indian accounting & GST billing"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & DI
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Offline-first database (local source of truth)
  drift: ^2.21.0
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.27
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3

  # Exact money math for accounting
  decimal: ^3.0.2
  rational: ^2.2.3

  # India locale, currency, dates
  intl: ^0.20.1

  # Charts
  fl_chart: ^0.69.2

  # PDF invoices
  pdf: ^3.11.2

  # UPI QR codes on invoice PDFs (pure Dart, no native deps)
  qr: ^3.0.2

  # Real .xlsx exports (statement of account etc.)
  excel: ^4.0.6
  printing: ^5.13.4

  # Reads Vyapar's .vyb backups, which are ZIP archives holding a SQLite
  # file. Constrained to 3.x because excel already pins ^3.6.1.
  archive: ^3.6.1

  # Raw spooling to a Windows print queue (winspool.drv) for USB label
  # printers. Pure Dart, already present transitively via file_picker.
  ffi: ^2.1.0

  # Utilities
  uuid: ^4.5.1
  collection: ^1.18.0
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.3
  file_picker: ^8.1.6
  open_filex: ^4.5.0
  phosphor_flutter: ^2.1.0
  flutter_svg: ^2.0.16

  # Optional cloud sync (inert until configured in Settings)
  supabase_flutter: ^2.8.0
  crypto: ^3.0.7
  # `simple_barcode_scanner` was REMOVED from here.
  #
  # It was declared but imported nowhere in the app, so there has never been any
  # camera barcode scanning on any platform: POS relies entirely on a hardware
  # scanner presenting itself as a keyboard wedge (see `pos_screen.dart`), and
  # scanning a supplier bill goes through `file_picker`'s system camera picker.
  #
  # Keeping it also cost three transitive Windows plugins - `webview_windows`,
  # `permission_handler` and `permission_handler_windows` - and
  # `webview_windows_plugin.vcxproj` no longer compiles at all against MSVC
  # 14.51: its C++ uses `<experimental/coroutine>`, which MSVC now rejects with
  # `STL1011 ... will be REMOVED SOON`. The entire Windows build failed on it.
  #
  # To bring camera scanning back for real, add a maintained scanner and call it
  # from the POS search field; do not re-add this package expecting it to work.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Pure-Dart tests that must NOT run under TestWidgetsFlutterBinding — the
  # binding stubs every HttpClient for the rest of the process, which is
  # fatal for live TLS tests. Used by test/le_trust_store_live_test.dart.
  test: ^1.25.0

  # Codegen for Drift. These must be real dev dependencies — listing them
  # only under dependency_overrides left the build plan with zero builders
  # and "wrote 0 outputs".
  build_runner: ^2.4.14
  drift_dev: ^2.21.0

# phosphor_flutter 2.1.0 subclasses IconData, which became a final class in
# Flutter 3.47 — a hard compile error on every target. Upstream never patched
# it, so we vendor a patched copy that constructs plain IconData instead.
dependency_overrides:
  phosphor_flutter:
    path: third_party/phosphor_flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logo/
    # The Let's Encrypt roots, for devices whose own trust store predates
    # ISRG Root X2. Used only as a fallback after the platform store has
    # already refused the handshake — see lib/core/api/le_trust_store.dart.
    - assets/certs/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter[opsz,wght].ttf
        - asset: assets/fonts/Inter-Italic[opsz,wght].ttf
          style: italic
